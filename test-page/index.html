<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sample Job Application</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
      .field { margin-bottom: 16px; }
      label, .q { display: block; font-weight: 600; margin-bottom: 4px; }
      input, textarea, select { width: 100%; padding: 8px; font: inherit; box-sizing: border-box; }
      textarea { min-height: 100px; }
    </style>
  </head>
  <body>
    <h1>Software Engineer — Application</h1>
    <!-- Each field uses a different labeling pattern to exercise the scanner. -->
    <form onsubmit="event.preventDefault(); alert(JSON.stringify(Object.fromEntries(new FormData(this)), null, 2));">
      <div class="field">
        <label for="fn">First Name *</label>
        <input id="fn" name="first_name" required />
      </div>
      <div class="field">
        <label>Last Name <input name="lname" /></label>
      </div>
      <div class="field">
        <input name="applicant_email" type="email" placeholder="Email address" />
      </div>
      <div class="field">
        <span id="phone-label" class="q">Mobile number</span>
        <input name="contact" type="tel" aria-labelledby="phone-label" />
      </div>
      <div class="field">
        <input name="profile_url" type="url" aria-label="LinkedIn Profile" />
      </div>
      <div class="field">
        <div class="q">Paste your resume</div>
        <textarea name="resume_text"></textarea>
      </div>
      <div class="field">
        <label for="why">Why do you want to work here?</label>
        <textarea id="why" name="why"></textarea>
      </div>
      <div class="field">
        <label for="ref">How did you hear about us?</label>
        <input id="ref" name="referral_source" />
      </div>
      <input type="hidden" name="csrf" value="abc123" />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
