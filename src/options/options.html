<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobApply Autofill – Profile</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f9fafb;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #d1d5db;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f17;
          --card: #111827;
          --text: #f3f4f6;
          --muted: #9ca3af;
          --border: #374151;
          --accent: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p.hint { margin: 0 0 20px; color: var(--muted); }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      label { display: block; margin-bottom: 14px; font-weight: 500; }
      input, textarea {
        display: block;
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      textarea { min-height: 200px; resize: vertical; }
      .actions { display: flex; align-items: center; gap: 12px; }
      button {
        padding: 8px 18px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      .status { color: var(--muted); }
      @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./options.tsx"></script>
  </body>
</html>
